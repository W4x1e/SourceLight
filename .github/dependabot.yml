# Security updates arrive as soon as an advisory is published; these are the
# routine version updates, kept to a weekly batch per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # No entry for mobile/src-tauri: it depends on crates outside its folder
  # (mobile/plugins, src-tauri/crates), which Dependabot can't resolve.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6 under another name, kept for its compiler API (used by
      # src/i18n/literals.ts and three tests), which TypeScript 7 doesn't ship.
      - dependency-name: typescript-api
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
