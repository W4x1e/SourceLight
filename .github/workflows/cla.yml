# Asks each new contributor to sign CLA.md on their first pull request, and
# records the signature on the `cla-signatures` branch.
#
# pull_request_target runs with this repository's token even for a pull
# request from a fork, so the CLA check can comment and set a status. That is
# safe here only because this job never checks out or runs the pull request's
# code. Keep it that way.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      # v2.6.1, pinned by commit: this job holds a write token on fork PRs.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/W4x1e/sourcelight/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The action can see a bot's login with or without the [bot]
          # suffix, so both spellings are listed.
          allowlist: W4x1e,dependabot,dependabot[bot],github-actions[bot]
