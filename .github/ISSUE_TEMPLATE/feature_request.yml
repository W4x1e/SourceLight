name: Feature request
description: Something SourceLight should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the workflow, before any solution — what you were doing when you missed this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Other apps that do it well are useful references.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Workarounds, or other tools you use for this.
