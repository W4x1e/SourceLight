# cargo-about configuration for the phone app — its third-party notices
# (mobile/THIRD-PARTY-LICENSES.txt), which the app shows under Open-source
# licences in its menu.
#
#   cd mobile/src-tauri
#   cargo about generate --manifest-path Cargo.toml -c about.toml ../about.hbs \
#       -o ../THIRD-PARTY-LICENSES.txt
#
# The accepted list mirrors src-tauri/about.toml and src-tauri/deny.toml,
# which the phone's licence check uses too.

# What reaches phones: the Android arm64 build.
targets = ["aarch64-linux-android"]

ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates (publish = false) are the product, not third-party.
private = { ignore = true }

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "NCSA",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
